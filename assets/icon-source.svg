<?xml version="1.0" encoding="UTF-8"?>
<!--
  FlexYug app-icon source — the adaptive F-bar mark, fixed to the Forge (green)
  skin for the static store icon. Mirrors src/ui/Logo.tsx (FBarMark) geometry,
  scaled and centered on a 1024x1024 dark field.

  Export to PNG (requires a rasterizer, e.g. rsvg-convert / Inkscape / sharp):
    rsvg-convert -w 1024 -h 1024 assets/icon-source.svg -o assets/icon.png
    rsvg-convert -w 1024 -h 1024 assets/icon-source.svg -o assets/adaptive-icon.png
    rsvg-convert -w 96   -h 96   assets/icon-source.svg -o assets/notification-icon.png
  Splash (assets/splash.png) uses the same mark on bg per app.config.ts sizing.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#0F1411"/>
  <!-- mark: source viewBox 0..100 scaled x6.2 (=620px) and centered (translate 202,202) -->
  <g transform="translate(202,202) scale(6.2)">
    <!-- F stem -->
    <rect x="22" y="14" width="15" height="72" rx="4" fill="#E8F0EA"/>
    <!-- F top arm -->
    <rect x="22" y="14" width="50" height="15" rx="4" fill="#E8F0EA"/>
    <!-- middle arm = loaded barbell (Forge accent) -->
    <rect x="22" y="46" width="44" height="11" rx="5" fill="#6DA37E"/>
    <rect x="60" y="40" width="8" height="23" rx="3" fill="#6DA37E"/>
    <rect x="70" y="44" width="6" height="15" rx="3" fill="#6DA37E"/>
  </g>
</svg>
