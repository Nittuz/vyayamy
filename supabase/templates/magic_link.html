<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Sign in to Vyayamy</title>
</head>
<body style="margin:0; padding:0; background-color:#F8F8F6; font-family:-apple-system, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; -webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F8F8F6; padding:40px 20px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px; background-color:#FFFFFF; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.08); overflow:hidden;">
          <!-- Header -->
          <tr>
            <td align="center" style="padding:40px 32px 0;">
              <div style="width:48px; height:48px; background-color:#1C1917; border-radius:12px; color:#FFFFFF; font-size:24px; font-weight:700; line-height:48px; text-align:center; letter-spacing:-0.03em;">V</div>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:24px 32px 0; text-align:center;">
              <h1 style="margin:0 0 8px; font-size:22px; font-weight:700; color:#1C1917; letter-spacing:-0.02em;">Sign in to Vyayamy</h1>
              <p style="margin:0 0 28px; font-size:15px; color:#78716C; line-height:1.5;">Tap the button below to securely sign in. This link expires in 10 minutes.</p>
            </td>
          </tr>
          <!-- CTA -->
          <tr>
            <td align="center" style="padding:0 32px;">
              <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block; width:100%; max-width:320px; padding:14px 24px; background-color:#1C1917; color:#FFFFFF; font-size:16px; font-weight:600; text-decoration:none; border-radius:8px; text-align:center; box-sizing:border-box;">Sign in</a>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:28px 32px 36px; text-align:center;">
              <p style="margin:0; font-size:13px; color:#A8A29E; line-height:1.5;">If you didn't request this, you can safely ignore this email.</p>
            </td>
          </tr>
        </table>
        <!-- Sub-footer -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;">
          <tr>
            <td style="padding:20px 32px 0; text-align:center;">
              <p style="margin:0; font-size:11px; color:#A8A29E;">Vyayamy — Track your training, with less noise.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
